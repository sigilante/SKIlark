name: CI

# A change only to prose skips CI.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "img/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "img/**"
      - "LICENSE"

# Avon is pinned to the commit that has `batch --dag`; skijack 0.2.1, from
# PyPI, has the reducer switch.  Every job runs a test a core
# (pytest-xdist).
env:
  AVON_REF: 65ae1a5b24d9813566cfd2eb38f8c01707da8259      # sigilante/avon #60, batch --dag

jobs:
  # The suite on each Python, its reductions on Avon, which the reference
  # job checks against aviary's.
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigilante/avon
          ref: ${{ env.AVON_REF }}
          path: .avon        # a dot directory, which pytest does not collect
      - run: make -C .avon -j4 CC=clang-18 build/avon
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -n auto
        env:
          AVON: ${{ github.workspace }}/.avon/build/avon
          SKIJACK_REDUCER: avon

  # The reference: every reduction run by aviary, the reference reducer,
  # and by Avon, and compared, the suite split over four jobs
  # (SKILARK_SHARD, tests/conftest.py).
  avon:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigilante/avon
          ref: ${{ env.AVON_REF }}
          path: .avon
      - run: make -C .avon -j4 CC=clang-18 build/avon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -n auto
        env:
          AVON: ${{ github.workspace }}/.avon/build/avon
          SKIJACK_REDUCER: check
          SKILARK_SHARD: ${{ matrix.shard }}

  # The slow tests alone (the level-1 measurements and the fuzz), which are
  # slow in Python, on Avon.
  slow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigilante/avon
          ref: ${{ env.AVON_REF }}
          path: .avon
      - run: make -C .avon -j4 CC=clang-18 build/avon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -n auto --runslow -m slow
        env:
          AVON: ${{ github.workspace }}/.avon/build/avon
          SKIJACK_REDUCER: avon
