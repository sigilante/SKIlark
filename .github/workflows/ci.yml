name: CI

# A change only to prose skips CI.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "img/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "img/**"
      - "LICENSE"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  # The suite on Avon: every reduction run by Avon and by aviary and
  # compared, then the level-1 measurements, which are slow in Python, on
  # Avon alone.  Avon is pinned to the commit that has `batch --dag`; skijack
  # 0.2.1, from PyPI, has the reducer switch.
  avon:
    runs-on: ubuntu-24.04
    env:
      AVON_REF: 65ae1a5b24d9813566cfd2eb38f8c01707da8259      # sigilante/avon #60, batch --dag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigilante/avon
          ref: ${{ env.AVON_REF }}
          path: .avon        # a dot directory, which pytest does not collect
      - run: make -C .avon -j4 CC=clang-18 build/avon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
        env:
          AVON: ${{ github.workspace }}/.avon/build/avon
          SKIJACK_REDUCER: check
      - run: python -m pytest -q --runslow
        env:
          AVON: ${{ github.workspace }}/.avon/build/avon
          SKIJACK_REDUCER: avon
