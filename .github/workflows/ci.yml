name: CI

# A change only to prose skips CI.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "img/**"
      - "LICENSE"
  pull_request:
    # labeled: adding the `reference` label runs the reference job
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "img/**"
      - "LICENSE"

# Avon is pinned to the commit that runs natDiv and natRem natively;
# skijack 0.2.2, from PyPI, has the reducer switch and those operations.
# Every job runs a test a core (pytest-xdist).
env:
  AVON_REF: d826c644d390f67363af95dfc2db83dc6473ee98      # sigilante/avon #71, natDiv and natRem

jobs:
  # The suite on each Python, its reductions on Avon, which the reference
  # job checks against aviary's.
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigilante/avon
          ref: ${{ env.AVON_REF }}
          path: .avon        # a dot directory, which pytest does not collect
      - run: make -C .avon -j4 CC=clang-18 build/avon
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -n auto
        env:
          AVON: ${{ github.workspace }}/.avon/build/avon
          SKIJACK_REDUCER: avon

  # The reference: every reduction run by aviary, the reference reducer,
  # and by Avon, and compared, the suite split over four jobs
  # (SKILARK_SHARD, tests/conftest.py).  The pinned outcomes and counts
  # already hold Avon to aviary's numbers, so the reference runs on each
  # push to master and on a pull request labelled `reference`: label one
  # that changes the kernel, re-records pins, or moves Avon or skijack.
  avon:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'reference')
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigilante/avon
          ref: ${{ env.AVON_REF }}
          path: .avon
      - run: make -C .avon -j4 CC=clang-18 build/avon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -n auto
        env:
          AVON: ${{ github.workspace }}/.avon/build/avon
          SKIJACK_REDUCER: check
          SKILARK_SHARD: ${{ matrix.shard }}

  # The slow tests alone (the level-1 measurements and the fuzz), which are
  # slow in Python, on Avon.
  slow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigilante/avon
          ref: ${{ env.AVON_REF }}
          path: .avon
      - run: make -C .avon -j4 CC=clang-18 build/avon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -n auto --runslow -m slow
        env:
          AVON: ${{ github.workspace }}/.avon/build/avon
          SKIJACK_REDUCER: avon
