[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "skilark"
version = "0.1.0"
description = "Joy on SKIjack: a concatenative language whose words are closed SKI supercombinators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "N. E. Davis" }]
keywords = ["concatenative", "Joy", "Forth", "SKI", "combinator", "skijack"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Interpreters",
]
dependencies = ["skijack>=0.2.0,<0.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/sigilante/SKIlark"

[tool.setuptools.packages.find]
include = ["skilark*"]

[tool.setuptools.package-data]
skilark = ["programs/*.ski"]
